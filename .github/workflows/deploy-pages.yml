name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        run: |
          mkdir .site-deploy
          cp -R index.html pages dashboard assets documentation manifest.webmanifest robots.txt sitemap.xml .site-deploy/
          touch .site-deploy/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-deploy
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
