<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Something grand is on its way.. Explore thoughtfully designed banquet spaces and celebration experiences in The Grand Venue."
    />
    <meta
      property="og:title"
      content="Something grand is on its way. | The Grand Venue"
    />
    <meta
      property="og:description"
      content="Something grand is on its way.. Explore thoughtfully designed banquet spaces and celebration experiences in The Grand Venue."
    />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://example.com/pages/coming-soon.html" />
    <meta
      property="og:url"
      content="https://example.com/pages/coming-soon.html"
    />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#641c35" />
    <title>Something grand is on its way. | The Grand Venue</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="../assets/images/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/typography.css" />
    <link rel="stylesheet" href="../assets/css/spacing.css" />
    <link rel="stylesheet" href="../assets/css/premium.css" />
    <link rel="stylesheet" href="../assets/css/utility.css" />
    <script src="../assets/js/theme.js"></script>
  </head>
  <body class="utility-layout launch-page" data-root="../">
        <div class="utilities utility-controls">
          <button
            class="icon-btn"
            data-theme-toggle
            aria-label="Toggle light and dark theme"
          >
            <span class="theme-glyph theme-glyph-moon"
              ><i data-lucide="moon" aria-hidden="true"></i></span
            ><span class="theme-glyph theme-glyph-sun"
              ><i data-lucide="sun" aria-hidden="true"></i
            ></span></button
          ><button
            class="icon-btn"
            data-rtl-toggle
            aria-label="Toggle right to left layout"
          >
            <i data-lucide="pilcrow-right" aria-hidden="true"></i><span data-direction-label>RTL</span>
          </button>
        </div>
    <main id="main">
      <div class="utility-page">
        <a class="brand" href="home1.html"
          ><img
            src="../assets/images/logo.svg"
            alt="The Grand Venue"
            width="178"
            height="48" /></a
        ><img
          src="../assets/images/coming.webp"
          alt="Grand brass venue doors at dusk"
          class="coming-art"
          loading="eager"
          width="1200"
          height="800"
        />
        <p class="eyebrow"><span></span>THE GRAND VENUE</p>
        <h1>Something grand is on its way.</h1>
        <p>
          A new chapter in celebration is taking shape. Be the first to hear
          about it.
        </p>
        <div class="countdown" data-countdown="2027-06-01T10:00:00-04:00"></div>
        <form data-form="newsletter" novalidate>
          <div class="field">
            <label for="launchEmail">Email address</label
            ><input
              id="launchEmail"
              name="launchEmail"
              type="email"
              placeholder="Enter your email address"
              required
            /><small class="field-error" id="launchEmail-error"></small>
          </div>
          <button class="btn btn-primary" type="submit">
            Keep me in the loop
          </button>
          <p class="form-result" role="status"></p>
        </form>
        <p class="form-note">
          Subscriptions are saved on this device. No email is sent.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="home1.html"
            >Back to the venue<i
              data-lucide="arrow-right"
              aria-hidden="true"
            ></i></a
          ><a class="btn btn-secondary" href="contact.html"
            >Get in touch<i data-lucide="arrow-right" aria-hidden="true"></i
          ></a>
        </div>
      </div>
    </main>

    <dialog id="site-dialog" aria-labelledby="dialog-title">
      <button
        class="icon-btn dialog-close"
        data-close-dialog
        aria-label="Close dialog"
      >
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast-message" role="status" aria-live="polite"></div>
    <script src="../assets/vendor/bootstrap.bundle.min.js" defer></script>
    <script src="../assets/vendor/lucide.min.js" defer></script>

    <script src="../assets/js/demo-data.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/booking.js" defer></script>
  </body>
</html>
